services:
  postgres:
    image: postgres:16-alpine
    container_name: vakevahti-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vakevahti
      POSTGRES_PASSWORD: vakevahti
      POSTGRES_DB: vakevahti
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vakevahti -d vakevahti"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vakevahti-postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  vakevahti-postgres-data:
