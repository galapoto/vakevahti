name: Live Funding Source Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-source-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vakevahti
          POSTGRES_PASSWORD: vakevahti
          POSTGRES_DB: vakevahti_live_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vakevahti -d vakevahti_live_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://vakevahti:vakevahti@127.0.0.1:5432/vakevahti_live_smoke

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Install Chromium fallback
        run: python -m playwright install --with-deps chromium

      - name: Apply ephemeral smoke database migrations
        run: alembic upgrade head

      - name: Haeavustuksia.fi baseline live ingestion
        shell: bash
        run: |
          set -o pipefail
          python -m app.cli scan-source-persist HAEAVUSTUKSIA | tee ../haeavustuksia-first.txt

      - name: Haeavustuksia.fi repeat/idempotency live ingestion
        shell: bash
        run: |
          set -o pipefail
          python -m app.cli scan-source-persist HAEAVUSTUKSIA | tee ../haeavustuksia-second.txt
          grep -q 'baseline=False' ../haeavustuksia-second.txt
          grep -q 'new=0' ../haeavustuksia-second.txt
          grep -q 'changed=0' ../haeavustuksia-second.txt

      - name: Haeavustuksia.fi classification evidence
        run: python -m app.cli source-distribution HAEAVUSTUKSIA | tee ../haeavustuksia-distribution.txt

      - name: EURA 2021 baseline live ingestion
        shell: bash
        run: |
          set -o pipefail
          python -m app.cli scan-source-persist EURA | tee ../eura-first.txt

      - name: EURA 2021 repeat/idempotency live ingestion
        shell: bash
        run: |
          set -o pipefail
          python -m app.cli scan-source-persist EURA | tee ../eura-second.txt
          grep -q 'baseline=False' ../eura-second.txt
          grep -q 'new=0' ../eura-second.txt
          grep -q 'changed=0' ../eura-second.txt

      - name: EURA 2021 classification evidence
        run: python -m app.cli source-distribution EURA | tee ../eura-distribution.txt

      - name: Upload live validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-funding-source-smoke-${{ github.run_id }}
          path: |
            haeavustuksia-first.txt
            haeavustuksia-second.txt
            haeavustuksia-distribution.txt
            eura-first.txt
            eura-second.txt
            eura-distribution.txt
          if-no-files-found: warn
          retention-days: 14
