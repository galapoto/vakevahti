name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vakevahti
          POSTGRES_PASSWORD: vakevahti
          POSTGRES_DB: vakevahti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vakevahti -d vakevahti_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://vakevahti:vakevahti@127.0.0.1:5432/vakevahti_test
      TEST_DATABASE_URL: postgresql+asyncpg://vakevahti:vakevahti@127.0.0.1:5432/vakevahti_test
      ALLOW_TEST_DATABASE_REUSE: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e '.[dev]'

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Apply database migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest -q
