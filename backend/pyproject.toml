[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vakevahti-backend"
version = "0.1.0"
description = "VakeVahti funding-monitoring backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "beautifulsoup4>=4.12",
  "fastapi>=0.141.1,<1",
  "httpx>=0.27,<1",
  "lxml>=5",
  "playwright>=1.62,<2",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.36,<3",
  "tzdata; sys_platform == 'win32'",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL and TEST_DATABASE_URL",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/ui/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
